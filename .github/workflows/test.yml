name: Tests y deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deploys pisen el orden de publicación si hay pushes seguidos a main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests
        run: npm test

  # Tests de seguridad de la base (RLS, FK compuestas, superadmin; ver docs/MULTI-FAMILIA.md):
  # levanta un Supabase local en el runner, aplica schema.sql y los datos dummy, y corre
  # test/sql/seguridad.sql. Si un chequeo falla, psql corta con "FALLA: ..." y no se publica.
  seguridad-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Levantar Supabase local
        # Solo hace falta la base y Auth (crea el esquema auth); el resto no se usa.
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api

      - name: Aplicar schema.sql y datos dummy
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -f schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f scripts/sql/datos_dummy.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f scripts/sql/estado.sql

      - name: Correr tests de seguridad
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DB" -v ON_ERROR_STOP=1 -f test/sql/seguridad.sql

  # Solo corre en push a main (no en pull requests), y solo si pasaron los tests de la app y
  # los de seguridad — así un test roto nunca llega a publicarse en GitHub Pages. Requiere que
  # en Settings → Pages → Source esté elegido "GitHub Actions" (no "Deploy from a branch").
  deploy:
    needs: [test, seguridad-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Solo lo que el sitio realmente necesita para funcionar — nada de schema.sql,
      # migrations/, test/, package.json, etc. (antes se publicaba el repo entero: con
      # "Deploy from a branch" GitHub Pages sirve la raíz completa tal cual, sin filtrar).
      - name: Armar carpeta pública
        run: |
          mkdir _site
          cp index.html app.js style.css favicon.ico favicon.png _site/
          cp -r assets _site/assets

      - name: Subir sitio como artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
