<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Control — Control Económico</title>
<script>
  // Aplicar el tema guardado ANTES de que cargue el CSS, para no mostrar un flash del tema claro
  // al entrar de nuevo con el oscuro elegido.
  try{
    if(localStorage.getItem('controlTema') === 'oscuro') document.documentElement.setAttribute('data-theme','oscuro');
    var colorGuardado = localStorage.getItem('controlTemaColor');
    if(colorGuardado === 'azul' || colorGuardado === 'naranja') document.documentElement.setAttribute('data-color', colorGuardado);
  }catch(e){}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
<div class="login-wrap" id="loginWrap" style="display:none">
  <div class="login-card">
    <h1 style="font-size:24px;margin-bottom:4px">Control</h1>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:20px">Iniciá sesión para ver tu control económico</div>
    <div id="loginMsg"></div>
    <div class="field" style="margin-bottom:10px"><label>Email</label><input type="email" id="login-email" style="width:100%"></div>
    <div class="field" style="margin-bottom:16px"><label>Contraseña</label>
      <div class="password-wrap">
        <input type="password" id="login-password" style="width:100%">
        <button type="button" id="btnVerPassword" class="password-ojo" aria-label="Mostrar contraseña" title="Mostrar contraseña"><i class="bi bi-eye"></i></button>
      </div>
    </div>
    <button id="btnLogin" style="width:100%">Iniciar sesión</button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <div class="loading">Cargando datos...</div>
</div>

<script src="app.js"></script>
</body>
</html>
